<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>pwubhyta cantikku</title>
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-dark: #141414;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            display: none;
            width: 100%;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }

        /* --- Welcome & Login --- */
        #page1 h1 { font-size: clamp(2rem, 10vw, 4rem); color: var(--netflix-red); font-weight: 900; letter-spacing: 4px; text-align: center; }
        .btn-start { background-color: var(--netflix-red); color: white; border: none; padding: 16px 45px; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 4px; }
        #page2 { background-color: #ffffff; color: #333; }
        .input-box { padding: 15px; width: 85%; max-width: 320px; border: 2px solid #ddd; border-radius: 4px; text-align: center; }

        /* --- Room Selection --- */
        .profile-selection-container { text-align: center; width: 100%; padding: 0 10px; }
        .main-profile { margin-bottom: 40px; display: flex; justify-content: center; }
        .secondary-profiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 400px; margin: 0 auto; padding: 0 15px; }
        .profile-card { text-align: center; cursor: pointer; color: inherit; text-decoration: none; }
        
        .profile-img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            border-radius: 4px; 
            overflow: hidden; 
            background-color: #333; 
            border: 2px solid transparent; 
            transition: 0.3s; 
        }

        /* Thumbnail Khusus Pantai Batu Bekung (Portrait Aspect) */
        .portrait-thumb { aspect-ratio: 2/3 !important; }

        .main-profile .profile-img { width: 160px; height: 160px; }
        .profile-img img { width: 100%; height: 100%; object-fit: cover; }
        .profile-card:hover .profile-img { border-color: white; transform: scale(1.05); }
        .profile-card p { font-size: 0.75rem; margin-top: 10px; color: #a3a3a3; text-transform: uppercase; font-weight: bold; }

        /* --- Portrait Video Layout (Page 4) --- */
        #page4 { display: block; background-color: #000; }
        .nav-header { position: fixed; top: 0; width: 100%; height: 60px; display: flex; align-items: center; padding: 0 20px; z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); }
        .btn-back { color: white; background: none; border: none; font-size: 1.8rem; cursor: pointer; }
        
        .video-player-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .portrait-frame {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
        }

        .portrait-frame iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
    </style>
</head>
<body>

    <div id="page1" class="page" style="display: flex;">
        <h1>SELAMAT DATANG</h1>
        <button class="btn-start" onclick="nextPage(2)">START</button>
    </div>

    <div id="page2" class="page">
        <h2 style="font-weight: bold; margin-bottom: 30px;">DI ISI YA BIDADARIKU</h2>
        <input type="text" id="nameInput" class="input-box" placeholder="Ketikan nama lengkapmu...">
        <button class="btn-start" onclick="validateName()">MASUK</button>
    </div>

    <div id="page3" class="page">
        <div class="profile-selection-container">
            <h1 style="font-size: 1.8rem; margin-bottom: 30px; font-weight: bold;">Who's watching?</h1>
            <div class="main-profile">
                <div class="profile-card" onclick="openRoom('CINTAKU')">
                    <div class="profile-img"><img src="2026_05_14_03_59_IMG_3788.JPG"></div>
                    <p>CINTAKU</p>
                </div>
            </div>
            <div class="secondary-profiles">
                <!-- MENGGUNAKAN FOTO TERBARU SEBAGAI THUMBNAIL -->
                <div class="profile-card" onclick="openRoom('PANTAI BATU BEKUNG')">
                    <div class="profile-img portrait-thumb"><img src="2026_05_14_23_52_IMG_3806.JPG" alt="PANTAI BATU BEKUNG"></div>
                    <p>PANTAI BATU BEKUNG</p>
                </div>
                <div class="profile-card" onclick="openRoom('TUMPAK SEWU')">
                    <div class="profile-img"><img src="2026_05_14_04_51_IMG_3792.JPG"></div>
                    <p>TUMPAK SEWU</p>
                </div>
                <div class="profile-card" onclick="openRoom('JATIM PARK')">
                    <div class="profile-img"><img src="2026_05_14_04_02_IMG_3790.JPG"></div>
                    <p>JATIM PARK</p>
                </div>
                <div class="profile-card" onclick="openRoom('DANCOK CAFE')">
                    <div class="profile-img"><img src="2026_05_14_04_03_IMG_3791.JPG"></div>
                    <p>DANCOK CAFE</p>
                </div>
            </div>
        </div>
    </div>

    <div id="page4" class="page">
        <div class="nav-header">
            <button class="btn-back" onclick="nextPage(3)">←</button>
            <span id="roomTitle" style="font-weight: bold; margin-left: 15px;"></span>
        </div>
        <div class="video-player-container">
            <div class="portrait-frame">
                <iframe id="videoIframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            const target = document.getElementById('page' + pageNumber);
            target.style.display = (pageNumber === 4) ? 'block' : 'flex';
        }

        function validateName() {
            const input = document.getElementById('nameInput').value.toLowerCase().trim();
            if (input === "bhytania avrinda pubhyta vanha") { nextPage(3); } 
            else { alert("Nama tidak cocok!"); }
        }

        function openRoom(title) {
            const pin = prompt("🔐 PIN 4-digit:");
            if (pin === "1111") {
                document.getElementById('roomTitle').innerText = title;
                const iframe = document.getElementById('videoIframe');
                
                // MENGGUNAKAN LINK VIDEO TERBARU
                if (title === 'PANTAI BATU BEKUNG') {
                    iframe.src = "https://drive.google.com/file/d/1ci9uiSL6AkFV33tNYzIbLD7aD7M_fdVu/preview";
                } else if (title === 'TUMPAK SEWU') {
                    iframe.src = "https://drive.google.com/file/d/1m5GIKT7KUkGkQy8tuphcjGami00YdgSy/preview";
                } else {
                    iframe.src = "";
                }

                nextPage(4);
            } else if (pin !== null) { alert("❌ PIN Salah!"); }
        }
    </script>
</body>
</html>
