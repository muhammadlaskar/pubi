<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Birthday Project</title>
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-dark: #141414;
            --soft-white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .page {
            display: none;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }

        /* --- Halaman 1: Welcome --- */
        #page1 {
            display: flex;
            background-color: var(--bg-dark);
            color: var(--netflix-red);
        }

        #page1 h1 {
            font-size: 4rem;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn-start {
            background-color: var(--netflix-red);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .btn-finish {
            background-color: #333;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 4px;
            position: absolute;
        }

        /* --- Halaman 2: Username --- */
        #page2 {
            background-color: var(--soft-white);
            color: #333;
        }

        .input-box {
            padding: 15px;
            width: 300px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        /* --- Halaman 3: Netflix Room Selection --- */
        #page3 {
            background-color: var(--bg-dark);
            color: white;
        }

        .profile-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 900px;
        }

        .profile-card {
            text-align: center;
            cursor: pointer;
            width: 150px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            background-color: #555;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            margin-bottom: 10px;
            border: 3px solid transparent;
            transition: 0.3s;
        }

        .profile-card:hover .profile-img {
            border-color: white;
            transform: scale(1.05);
        }

        /* --- Halaman 4: Room Content --- */
        #page4 {
            background-color: var(--soft-white);
            color: #333;
        }
    </style>
</head>
<body>

    <!-- HALAMAN 1 -->
    <div id="page1" class="page">
        <h1>Selamat Datang</h1>
        <div class="btn-container">
            <button id="startBtn" class="btn-start" onclick="nextPage(2)">START</button>
            <button id="finishBtn" class="btn-finish" onmouseover="moveFinish()" style="right: 30%;">FINISH</button>
        </div>
    </div>

    <!-- HALAMAN 2 -->
    <div id="page2" class="page">
        <h2>Masukkan Nama Lengkap</h2>
        <input type="text" id="nameInput" class="input-box" placeholder="Siapa namamu?">
        <button class="btn-start" onclick="validateName()">Masuk</button>
        <p id="error-name" style="color: red; display: none; margin-top: 10px;">Nama salah!</p>
    </div>

    <!-- HALAMAN 3 -->
    <div id="page3" class="page">
        <h1 style="font-size: 2.5rem; margin-bottom: 30px;">Who's watching?</h1>
        <div class="profile-grid">
            <div class="profile-card" onclick="openRoom('Pantai')">
                <div class="profile-img" style="background-color: #1e90ff;">🏖️</div>
                <p>Pantai</p>
            </div>
            <div class="profile-card" onclick="openRoom('Air Terjun')">
                <div class="profile-img" style="background-color: #00ced1;">🌊</div>
                <p>Air Terjun</p>
            </div>
            <div class="profile-card" onclick="openRoom('Jatim Park')">
                <div class="profile-img" style="background-color: #ff4500;">🎡</div>
                <p>Jatim Park</p>
            </div>
            <div class="profile-card" onclick="openRoom('Surabaya')">
                <div class="profile-img" style="background-color: #32cd32;">🏙️</div>
                <p>Surabaya</p>
            </div>
            <div class="profile-card" onclick="openRoom('Dusun Kuliner')">
                <div class="profile-img" style="background-color: #daa520;">🍲</div>
                <p>Dusun Kuliner</p>
            </div>
            <div class="profile-card" onclick="openRoom('Dancok Cafe')">
                <div class="profile-img" style="background-color: #8b4513;">☕</div>
                <p>Dancok Cafe</p>
            </div>
        </div>
    </div>

    <!-- HALAMAN 4 (KONTEN ROOM) -->
    <div id="page4" class="page">
        <h1 id="roomTitle">Judul Room</h1>
        <div id="roomBody">Isi konten ada di sini...</div>
        <br>
        <button class="btn-start" onclick="nextPage(3)">Kembali Pilih Room</button>
    </div>

    <script>
        let startScale = 1;

        // Logika Tombol Finish Menghindar
        function moveFinish() {
            const btn = document.getElementById('finishBtn');
            const startBtn = document.getElementById('startBtn');
            
            // Gerakkan Finish secara acak
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';

            // Perbesar tombol Start
            startScale += 0.2;
            startBtn.style.transform = `scale(${startScale})`;
        }

        // Navigasi Halaman
        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('page' + pageNumber).style.display = 'flex';
        }

        // Validasi Nama
        function validateName() {
            const input = document.getElementById('nameInput').value.toLowerCase();
            const allowed = "bhitania avrinda pubhta vanha".toLowerCase();
            
            if (input === allowed) {
                nextPage(3);
            } else {
                document.getElementById('error-name').style.display = 'block';
            }
        }

        // Buka Room dengan PIN
        function openRoom(title) {
            const pin = prompt("Masukkan PIN untuk akses " + title + ":");
            if (pin === "1111") {
                document.getElementById('roomTitle').innerText = title;
                document.getElementById('roomBody').innerHTML = `<p>Selamat datang di room ${title}. Konten ini masih kosong.</p>`;
                nextPage(4);
            } else {
                alert("PIN Salah!");
            }
        }
    </script>
</body>
</html>
