<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>pwubhyta cantikku</title>
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-dark: #141414;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
        }

        .page {
            display: none;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }

        /* --- HALAMAN LOGIN (PC STYLE) --- */
        #page2 {
            display: flex;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('2026_05_14_03_59_IMG_3788.JPG');
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(8px);
        }

        .login-container {
            text-align: center;
            animation: fadeIn 1.5s ease-out;
        }

        .user-icon {
            width: 120px;
            height: 120px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            border: 2px solid rgba(255,255,255,0.5);
            overflow: hidden;
        }
        
        .user-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-container h2 {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 400;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .input-box {
            padding: 12px 20px;
            width: 250px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-box:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .btn-login {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 2px;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* --- ROOM SELECTION (TIDAK BERUBAH) --- */
        #page3 { overflow-y: auto; }
        .profile-selection-container { text-align: center; width: 100%; padding: 40px 10px; box-sizing: border-box; }
        .main-profile { margin-bottom: 40px; display: flex; justify-content: center; }
        .secondary-profiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 400px; margin: 0 auto; padding: 0 15px; }
        .profile-card { text-align: center; cursor: pointer; color: inherit; text-decoration: none; }
        .profile-img { width: 100%; aspect-ratio: 1/1; border-radius: 4px; overflow: hidden; background-color: #333; border: 2px solid transparent; transition: 0.3s; }
        .portrait-thumb { aspect-ratio: 2/3 !important; }
        .main-profile .profile-img { width: 160px; height: 160px; }
        .profile-img img { width: 100%; height: 100%; object-fit: cover; }
        .profile-card:hover .profile-img { border-color: white; }
        .profile-card p { font-size: 0.75rem; margin-top: 10px; color: #a3a3a3; text-transform: uppercase; font-weight: bold; }

        /* --- VIDEO LAYOUT (TIDAK BERUBAH) --- */
        #page4 { background-color: #000; overflow: hidden; }
        .nav-header { position: absolute; top: 0; width: 100%; height: 70px; display: flex; align-items: center; padding: 0 20px; z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); box-sizing: border-box; pointer-events: none; }
        .btn-back { color: white; background: none; border: none; font-size: 2rem; cursor: pointer; pointer-events: auto; }
        .video-fullscreen-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .video-fullscreen-container iframe { width: 100%; height: 100%; border: 0; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="page2" class="page" style="display: flex;">
        <div class="login-container">
            <div class="user-icon">
                <img src="2026_05_14_03_59_IMG_3788.JPG" alt="User">
            </div>
            <h2>Bidadariku</h2>
            <div class="input-group">
                <input type="text" id="nameInput" class="input-box" placeholder="Username" onkeypress="handleEnter(event)">
                <button class="btn-login" onclick="validateName()">→</button>
            </div>
            <p id="error-name" style="color: #ff4d4d; display: none; margin-top: 15px; font-size: 0.8rem;">Username tidak ditemukan.</p>
        </div>
    </div>

    <div id="page3" class="page">

                <div class="profile-card" onclick="openRoom('CINTAKU')">

            <div class="secondary-profiles">
                <div class="profile-card" onclick="openRoom('PANTAI BATU BEKUNG')">

                </div>
                <div class="profile-card" onclick="openRoom('TUMPAK SEWU')">
                    <div class="profile-img"><img src="2026_05_14_04_51_IMG_3792.JPG"></div>
                    <p>TUMPAK SEWU</p>
                </div>
                <div class="profile-card" onclick="openRoom('JATIM PARK')">
                    <div class="profile-img"><img src="2026_05_14_04_02_IMG_3790.JPG"></div>
                    <p>JATIM PARK</p>
                </div>
                <div class="profile-card" onclick="openRoom('DANCOK CAFE')">
                    <div class="profile-img"><img src="2026_05_14_04_03_IMG_3791.JPG"></div>
                    <p>DANCOK CAFE</p>
                </div>
            </div>
        </div>
    </div>

            <button class="btn-back" onclick="nextPage(3)">←</button>
