<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>pwubhyta cantikku</title>
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-dark: #141414;
            --soft-white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            display: none;
            width: 100%;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            padding: 20px 0;
            box-sizing: border-box;
        }

        /* --- ANIMASI --- */
        @keyframes profileFadeIn {
            from { opacity: 0; transform: scale(1.1); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes contentSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-profiles { animation: profileFadeIn 0.6s ease-out forwards; }
        .animate-content { animation: contentSlideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        /* --- Halaman 1: Welcome --- */
        #page1 h1 {
            font-size: clamp(2rem, 10vw, 4rem);
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--netflix-red);
            font-weight: 900;
            text-align: center;
            padding: 0 20px;
        }

        .btn-start {
            background-color: var(--netflix-red);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-start:active { transform: scale(0.95); }

        /* --- Halaman 2: Username --- */
        #page2 { background-color: var(--soft-white); color: #333; }
        .input-box {
            padding: 15px;
            width: 85%;
            max-width: 320px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: 20px;
            text-align: center;
            outline-color: var(--netflix-red);
        }

        /* --- Room Selection (Netflix Style) --- */
        .profile-selection-container { text-align: center; width: 100%; padding: 0 10px; }
        
        .main-profile { margin-bottom: 40px; display: flex; justify-content: center; }
        
        .secondary-profiles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .profile-card { text-align: center; cursor: pointer; text-decoration: none; color: inherit; }
        
        .profile-img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 4px;
            overflow: hidden;
            background-color: #333;
            transition: 0.3s;
            border: 2px solid transparent;
        }

        /* Ukuran khusus profil utama */
        .main-profile .profile-img { width: 160px; height: 160px; }

        .profile-img img { width: 100%; height: 100%; object-fit: cover; }
        .profile-card:hover .profile-img { border-color: white; transform: scale(1.05); }
        .profile-card p { font-size: 0.75rem; margin-top: 10px; color: #a3a3a3; text-transform: uppercase; font-weight: bold; }

        /* --- Room Content --- */
        #page4 { overflow-y: auto; background-color: var(--bg-dark); display: block; padding-top: 60px; }
        .content-card { width: 100%; padding: 0 15px; box-sizing: border-box; }
        
        .video-wrapper {
            position: relative;
            padding-bottom: 177.78%; /* Aspect ratio 9:16 untuk video portrait HP */
            height: 0;
            margin-bottom: 30px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        /* Jika video landscape, gunakan ini */
        .video-wrapper.landscape { padding-bottom: 56.25%; }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        .nav-header {
            position: fixed;
            top: 0; width: 100%; height: 60px;
            background: rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; z-index: 100;
        }

        .btn-back { color: white; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>

    <!-- HALAMAN 1 -->
    <div id="page1" class="page">
        <h1>SELAMAT DATANG</h1>
        <button class="btn-start" onclick="nextPage(2)">START</button>
    </div>

    <!-- HALAMAN 2 -->
    <div id="page2" class="page">
        <h2 style="font-weight: bold; margin-bottom: 30px; text-align: center;">DI ISI YA BIDADARIKU</h2>
        <input type="text" id="nameInput" class="input-box" placeholder="Ketikan nama lengkapmu...">
        <button class="btn-start" onclick="validateName()" style="font-size: 1rem;">MASUK</button>
        <p id="error-name" style="color: var(--netflix-red); display: none; margin-top: 15px; font-size: 0.9rem;">Nama tidak cocok!</p>
    </div>

    <!-- HALAMAN 3 -->
    <div id="page3" class="page">
        <div class="profile-selection-container animate-profiles">
            <h1 style="font-size: 1.8rem; margin-bottom: 30px; font-weight: bold;">Who's watching?</h1>
            <div class="main-profile">
                <div class="profile-card" onclick="openRoom('CINTAKU')">
                    <div class="profile-img"><img src="2026_05_14_03_59_IMG_3788.JPG" alt="Cintaku"></div>
                    <p>CINTAKU</p>
                </div>
            </div>
            <div class="secondary-profiles">
                <div class="profile-card" onclick="openRoom('PANTAI BATU BEKUNG')">
                    <div class="profile-img"><img src="2026_05_14_04_01_IMG_3789.JPG"></div>
                    <p>PANTAI BATU BEKUNG</p>
                </div>
                <div class="profile-card" onclick="openRoom('TUMPAK SEWU')">
                    <div class="profile-img"><img src="2026_05_14_04_51_IMG_3792.JPG"></div>
                    <p>TUMPAK SEWU</p>
                </div>
                <div class="profile-card" onclick="openRoom('JATIM PARK')">
                    <div class="profile-img"><img src="2026_05_14_04_02_IMG_3790.JPG"></div>
                    <p>JATIM PARK</p>
                </div>
                <div class="profile-card" onclick="openRoom('DANCOK CAFE')">
                    <div class="profile-img"><img src="2026_05_14_04_03_IMG_3791.JPG"></div>
                    <p>DANCOK CAFE</p>
                </div>
            </div>
        </div>
    </div>

    <!-- HALAMAN 4 -->
    <div id="page4" class="page">
        <div class="nav-header">
            <button class="btn-back" onclick="nextPage(3)">←</button>
            <span id="roomTitle" style="font-weight: bold; letter-spacing: 1px;"></span>
            <div style="width: 24px;"></div>
        </div>
        <div id="roomBody" class="content-card animate-content"></div>
    </div>

    <script>
        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            const target = document.getElementById('page' + pageNumber);
            target.style.display = (pageNumber === 4) ? 'block' : 'flex';
            window.scrollTo(0,0);
        }

        function validateName() {
            const input = document.getElementById('nameInput').value.toLowerCase().trim();
            if (input === "bhytania avrinda pubhyta vanha") { nextPage(3); } 
            else { document.getElementById('error-name').style.display = 'block'; }
        }

        function createVideo(src, landscape = false) {
            const type = landscape ? 'landscape' : '';
            return `<div class="video-wrapper ${type}">
                <iframe src="${src}/preview" allow="autoplay; fullscreen" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
            </div>`;
        }

        function openRoom(title) {
            const pin = prompt("🔐 PIN 4-digit:");
            if (pin === "1111") {
                document.getElementById('roomTitle').innerText = title;
                const body = document.getElementById('roomBody');
                
                if (title === 'PANTAI BATU BEKUNG') {
                    body.innerHTML = 
                        createVideo("https://drive.google.com/file/d/1_rauyreFisKV5Z1V-HHJQ4pieAG4r792") +
                        createVideo("https://drive.google.com/file/d/1z4QYoUCukYF1RTY-BnAauBNArRGjsf1p") +
                        createVideo("https://drive.google.com/file/d/1m5GIKT7KUkGkQy8tuphcjGami00YdgSy");
                } else if (title === 'CINTAKU') {
                    body.innerHTML = `<div style="padding: 40px 20px; text-align: center;"><h2>Halaman Spesial ✨</h2><p>Terima kasih sudah selalu ada di sampingku.</p></div>`;
                } else {
                    body.innerHTML = `<div style="padding: 40px 20px; text-align: center;"><p>Konten sedang disiapkan untuk bidadariku.</p></div>`;
                }
                nextPage(4);
            } else if (pin !== null) { alert("❌ PIN Salah!"); }
        }
    </script>
</body>
</html>
