<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>pwubhyta cantikku</title>
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-dark: #141414;
            --soft-white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow-x: hidden;
        }

        .page {
            display: none;
            width: 100%;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            padding: 20px 0;
            box-sizing: border-box;
        }

        /* --- ANIMASI --- */
        @keyframes profileFadeIn {
            from { opacity: 0; transform: scale(1.1); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-profiles { animation: profileFadeIn 0.6s ease-out forwards; }

        /* --- Halaman 1: Welcome --- */
        #page1 h1 {
            font-size: clamp(2rem, 10vw, 4rem);
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--netflix-red);
            font-weight: 900;
            text-align: center;
        }

        .btn-start {
            background-color: var(--netflix-red);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* --- Halaman 2: Username --- */
        #page2 { background-color: var(--soft-white); color: #333; }
        .input-box {
            padding: 15px;
            width: 85%;
            max-width: 320px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            margin-bottom: 20px;
            text-align: center;
        }

        /* --- Room Selection --- */
        .profile-selection-container { text-align: center; width: 100%; padding: 0 10px; }
        .main-profile { margin-bottom: 40px; display: flex; justify-content: center; }
        .secondary-profiles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .profile-card { text-align: center; cursor: pointer; color: inherit; text-decoration: none; }
        .profile-img {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 4px;
            overflow: hidden;
            background-color: #333;
            border: 2px solid transparent;
            transition: 0.3s;
        }
        .main-profile .profile-img { width: 160px; height: 160px; }
        .profile-img img { width: 100%; height: 100%; object-fit: cover; }
        .profile-card:hover .profile-img { border-color: white; }
        .profile-card p { font-size: 0.75rem; margin-top: 10px; color: #a3a3a3; font-weight: bold; }

        /* --- Room Content (Video Fix) --- */
        #page4 { overflow-y: auto; background-color: #000; display: block; padding-top: 70px; }
        .nav-header {
            position: fixed;
            top: 0; width: 100%; height: 60px;
            background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; z-index: 100;
        }
        
        .video-container-fixed {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #000;
        }

        /* Menggunakan aspek rasio otomatis agar tidak memotong kontrol */
        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9; /* Standar untuk Landscape */
            background: #000;
        }

        /* Khusus video Portrait (Tegak) jika diperlukan */
        .video-box.portrait {
            aspect-ratio: 9 / 16;
        }

        .video-box iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        .btn-back { color: white; background: none; border: none; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div id="page1" class="page">
        <h1>SELAMAT DATANG</h1>
        <button class="btn-start" onclick="nextPage(2)">START</button>
    </div>

    <div id="page2" class="page">
        <h2 style="margin-bottom: 30px;">DI ISI YA BIDADARIKU</h2>
        <input type="text" id="nameInput" class="input-box" placeholder="Ketikan nama lengkapmu...">
        <button class="btn-start" onclick="validateName()">MASUK</button>
        <p id="error-name" style="color: var(--netflix-red); display: none; margin-top: 15px;">Nama tidak cocok!</p>
    </div>

    <div id="page3" class="page">
        <div class="profile-selection-container animate-profiles">
            <h1 style="font-size: 1.8rem; margin-bottom: 30px;">Who's watching?</h1>
            <div class="main-profile">
                <div class="profile-card" onclick="openRoom('CINTAKU')">
                    <div class="profile-img"><img src="2026_05_14_03_59_IMG_3788.JPG"></div>
                    <p>CINTAKU</p>
                </div>
            </div>
            <div class="secondary-profiles">
                <div class="profile-card" onclick="openRoom('PANTAI BATU BEKUNG')">
                    <div class="profile-img"><img src="2026_05_14_04_01_IMG_3789.JPG"></div>
                    <p>PANTAI BATU BEKUNG</p>
                </div>
                <div class="profile-card" onclick="openRoom('TUMPAK SEWU')">
                    <div class="profile-img"><img src="2026_05_14_04_51_IMG_3792.JPG"></div>
                    <p>TUMPAK SEWU</p>
                </div>
                <div class="profile-card" onclick="openRoom('JATIM PARK')">
                    <div class="profile-img"><img src="2026_05_14_04_02_IMG_3790.JPG"></div>
                    <p>JATIM PARK</p>
                </div>
                <div class="profile-card" onclick="openRoom('DANCOK CAFE')">
                    <div class="profile-img"><img src="2026_05_14_04_03_IMG_3791.JPG"></div>
                    <p>DANCOK CAFE</p>
                </div>
            </div>
        </div>
    </div>

    <div id="page4" class="page">
        <div class="nav-header">
            <button class="btn-back" onclick="nextPage(3)">←</button>
            <span id="roomTitle"></span>
            <div style="width: 24px;"></div>
        </div>
        <div id="roomBody" style="padding: 10px;"></div>
    </div>

    <script>
        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('page' + pageNumber).style.display = (pageNumber === 4) ? 'block' : 'flex';
            window.scrollTo(0,0);
        }

        function validateName() {
            const input = document.getElementById('nameInput').value.toLowerCase().trim();
            if (input === "bhytania avrinda pubhyta vanha") { nextPage(3); } 
            else { document.getElementById('error-name').style.display = 'block'; }
        }

        function createVid(src, isPortrait = false) {
            const portraitClass = isPortrait ? 'portrait' : '';
            return `<div class="video-container-fixed">
                <div class="video-box ${portraitClass}">
                    <iframe src="${src}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>
                </div>
            </div>`;
        }

        function openRoom(title) {
            const pin = prompt("🔐 PIN 4-digit:");
            if (pin === "1111") {
                document.getElementById('roomTitle').innerText = title;
                const body = document.getElementById('roomBody');
                
                if (title === 'PANTAI BATU BEKUNG') {
                    body.innerHTML = 
                        createVid("https://drive.google.com/file/d/1_rauyreFisKV5Z1V-HHJQ4pieAG4r792", true) + // Video 1 Portrait
                        createVid("https://drive.google.com/file/d/1z4QYoUCukYF1RTY-BnAauBNArRGjsf1p", false) + // Video 2 Landscape
                        createVid("https://drive.google.com/file/d/1m5GIKT7KUkGkQy8tuphcjGami00YdgSy", false);  // Video 3 Landscape
                } else {
                    body.innerHTML = `<div style="text-align:center; padding-top:50px;">Konten sedang disiapkan.</div>`;
                }
                nextPage(4);
            } else if (pin !== null) { alert("❌ PIN Salah!"); }
        }
    </script>
</body>
</html>
