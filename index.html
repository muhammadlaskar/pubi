<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Birthday Project</title>
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-dark: #141414;
            --soft-white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: var(--bg-dark);
        }

        .page {
            display: none;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }

        /* --- Halaman 1: Welcome --- */
        #page1 {
            display: flex;
            background-color: var(--bg-dark);
        }

        #page1 h1 {
            font-size: 4.5rem;
            margin-bottom: 60px;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: var(--netflix-red);
            font-weight: 900;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            text-align: center;
        }

        .btn-container {
            display: flex;
            gap: 30px;
            align-items: center;
            position: relative;
            min-height: 100px;
        }

        .btn-start {
            background-color: var(--netflix-red);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 2;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
            letter-spacing: 2px;
        }

        .btn-finish {
            background-color: #333;
            color: #aaa;
            border: none;
            padding: 18px 50px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            position: absolute;
            z-index: 1;
            transition: 0.1s ease-out;
            letter-spacing: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- Halaman 2: Username --- */
        #page2 {
            background-color: var(--soft-white);
            color: #333;
        }

        .input-box {
            padding: 15px;
            width: 350px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
            outline-color: var(--netflix-red);
        }

        /* --- Halaman 3: Netflix Room Selection --- */
        #page3 {
            background-color: var(--bg-dark);
            color: white;
        }

        .profile-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 900px;
        }

        .profile-card {
            text-align: center;
            cursor: pointer;
            width: 150px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            background-color: #555;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            margin-bottom: 10px;
            border: 3px solid transparent;
            transition: 0.3s;
        }

        .profile-card:hover .profile-img {
            border-color: white;
            transform: scale(1.05);
        }

        /* --- Halaman 4: Room Content --- */
        #page4 {
            background-color: var(--bg-dark);
            color: white;
            overflow-y: auto;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            width: 90%;
            max-width: 800px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div id="page1" class="page">
        <h1>SELAMAT DATANG</h1>
        <div class="btn-container">
            <button id="startBtn" class="btn-start" onclick="nextPage(2)">START</button>
            <button id="finishBtn" class="btn-finish" onmouseover="moveFinish()" style="left: 200px;">FINISH</button>
        </div>
    </div>

    <div id="page2" class="page">
        <h2 style="font-weight: bold; margin-bottom: 30px;">KONFIRMASI IDENTITAS</h2>
        <input type="text" id="nameInput" class="input-box" placeholder="Ketik nama lengkapmu...">
        <button class="btn-start" onclick="validateName()" style="font-size: 1.1rem; padding: 12px 30px;">MASUK</button>
        <p id="error-name" style="color: var(--netflix-red); display: none; margin-top: 15px; font-weight: bold;">Identitas tidak cocok!</p>
    </div>

    <div id="page3" class="page">
        <h1 style="font-size: 2.5rem; margin-bottom: 40px; font-weight: bold;">Who's watching?</h1>
        <div class="profile-grid">
            <div class="profile-card" onclick="openRoom('Pantai')">
                <div class="profile-img" style="background-color: #1e90ff;">🏖️</div>
                <p>Pantai</p>
            </div>
            <div class="profile-card" onclick="openRoom('Air Terjun')">
                <div class="profile-img" style="background-color: #00ced1;">🌊</div>
                <p>Air Terjun</p>
            </div>
            <div class="profile-card" onclick="openRoom('Jatim Park')">
                <div class="profile-img" style="background-color: #ff4500;">🎡</div>
                <p>Jatim Park</p>
            </div>
            <div class="profile-card" onclick="openRoom('Surabaya')">
                <div class="profile-img" style="background-color: #32cd32;">🏙️</div>
                <p>Surabaya</p>
            </div>
            <div class="profile-card" onclick="openRoom('Dusun Kuliner')">
                <div class="profile-img" style="background-color: #daa520;">🍲</div>
                <p>Dusun Kuliner</p>
            </div>
            <div class="profile-card" onclick="openRoom('Dancok Cafe')">
                <div class="profile-img" style="background-color: #8b4513;">☕</div>
                <p>Dancok Cafe</p>
            </div>
        </div>
        <button onclick="resetProgress()" style="margin-top: 50px; background: none; border: 1px solid #444; color: #444; cursor: pointer; padding: 5px 10px; border-radius: 4px;">Reset Progress</button>
    </div>

    <div id="page4" class="page">
        <h1 id="roomTitle" style="color: var(--netflix-red); font-weight: bold; margin-bottom: 20px;"></h1>
        <div id="roomBody" style="width: 100%; display: flex; justify-content: center;"></div>
        <br>
        <button class="btn-start" onclick="nextPage(3)" style="font-size: 0.9rem; padding: 10px 20px; margin-top: 20px;">KEMBALI</button>
    </div>

    <script>
        let startScale = 1;

        // FUNGSI MEMERIKSA STATUS SAAT REFRESH
        window.onload = function() {
            const lastPage = localStorage.getItem('activePage');
            if (lastPage) {
                nextPage(parseInt(lastPage), false);
            } else {
                nextPage(1, false);
            }
        };

        function moveFinish() {
            const btn = document.getElementById('finishBtn');
            const startBtn = document.getElementById('startBtn');
            const x = Math.random() * (window.innerWidth - 180);
            const y = Math.random() * (window.innerHeight - 60);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
            startScale += 0.15;
            startBtn.style.transform = `scale(${startScale})`;
        }

        function nextPage(pageNumber, save = true) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('page' + pageNumber).style.display = 'flex';
            
            // Simpan posisi halaman ke browser
            if(save) localStorage.setItem('activePage', pageNumber);
        }

        function validateName() {
            const input = document.getElementById('nameInput').value.toLowerCase().trim();
            const allowed = "bhytania avrinda pubhyta vanha".toLowerCase();
            if (input === allowed) {
                nextPage(3);
            } else {
                document.getElementById('error-name').style.display = 'block';
            }
        }

        function openRoom(title) {
            const pin = prompt("🔐 Masukkan PIN 4-digit:");
            if (pin === "1111") {
                document.getElementById('roomTitle').innerText = title;
                let content = "";
                if (title === 'Pantai') {
                    content = `<div class="video-container"><iframe src="https://drive.google.com/file/d/1_rauyreFisKV5Z1V-HHJQ4pieAG4r792/preview" allow="autoplay"></iframe></div>`;
                } else {
                    content = `<div style="text-align: center;"><h3>Konten room "${title}" belum tersedia.</h3></div>`;
                }
                document.getElementById('roomBody').innerHTML = content;
                nextPage(4);
            } else {
                alert("❌ PIN Salah!");
            }
        }

        function resetProgress() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
