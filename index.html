<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Birthday Project</title>
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-dark: #141414;
            --soft-white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow-x: hidden;
        }

        .page {
            display: none;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }

        /* --- Halaman 1: Welcome --- */
        #page1 {
            display: flex;
        }

        #page1 h1 {
            font-size: 4.5rem;
            margin-bottom: 60px;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: var(--netflix-red);
            font-weight: 900;
            text-align: center;
        }

        .btn-container {
            display: flex;
            gap: 30px;
            align-items: center;
            position: relative;
            min-height: 100px;
        }

        .btn-start {
            background-color: var(--netflix-red);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            z-index: 2;
            transition: transform 0.3s;
        }

        .btn-finish {
            background-color: #333;
            color: #aaa;
            border: none;
            padding: 18px 50px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            position: absolute;
            z-index: 1;
            transition: 0.1s;
        }

        /* --- Halaman 2: Username --- */
        #page2 {
            background-color: var(--soft-white);
            color: #333;
        }

        .input-box {
            padding: 15px;
            width: 350px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        /* --- Halaman 3: Netflix Room Selection --- */
        .profile-selection-container {
            text-align: center;
            max-width: 1000px;
        }

        .main-profile {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .secondary-profiles {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .profile-card {
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            margin-bottom: 10px;
            border: 4px solid transparent;
        }

        .profile-card:hover .profile-img {
            border-color: white;
            transform: scale(1.05);
        }

        /* --- Halaman 4: Room Content --- */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            width: 90%;
            max-width: 800px;
            overflow: hidden;
            border-radius: 10px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- HALAMAN 1 -->
    <div id="page1" class="page">
        <h1>SELAMAT DATANG</h1>
        <div class="btn-container">
            <button id="startBtn" class="btn-start" onclick="nextPage(2)">START</button>
            <button id="finishBtn" class="btn-finish" onmouseover="moveFinish()" style="left: 200px;">FINISH</button>
        </div>
    </div>

    <!-- HALAMAN 2 -->
    <div id="page2" class="page">
        <h2 style="font-weight: bold; margin-bottom: 30px;">KONFIRMASI IDENTITAS</h2>
        <input type="text" id="nameInput" class="input-box" placeholder="Ketik nama lengkapmu...">
        <button class="btn-start" onclick="validateName()" style="font-size: 1.1rem; padding: 12px 30px;">MASUK</button>
        <p id="error-name" style="color: var(--netflix-red); display: none; margin-top: 15px;">Nama tidak cocok!</p>
    </div>

    <!-- HALAMAN 3 -->
    <div id="page3" class="page">
        <div class="profile-selection-container">
            <h1 style="font-size: 2.5rem; margin-bottom: 40px; font-weight: bold;">Who's watching?</h1>
            
            <div class="main-profile">
                <div class="profile-card" onclick="openRoom('CINTAKU')">
                    <div class="profile-img" style="background-color: #e91e63; width: 170px; height: 170px;">💖</div>
                    <p style="font-size: 1.2rem; color: white;">CINTAKU</p>
                </div>
            </div>

            <div class="secondary-profiles">
                <div class="profile-card" onclick="openRoom('Pantai')">
                    <div class="profile-img" style="background-color: #1e90ff;">🏖️</div>
                    <p style="color: #888;">Pantai</p>
                </div>
                <div class="profile-card" onclick="openRoom('Air Terjun')">
                    <div class="profile-img" style="background-color: #00ced1;">🌊</div>
                    <p style="color: #888;">Air Terjun</p>
                </div>
                <div class="profile-card" onclick="openRoom('Jatim Park')">
                    <div class="profile-img" style="background-color: #ff4500;">🎡</div>
                    <p style="color: #888;">Jatim Park</p>
                </div>
                <div class="profile-card" onclick="openRoom('Dancok Cafe')">
                    <div class="profile-img" style="background-color: #8b4513;">☕</div>
                    <p style="color: #888;">Dancok Cafe</p>
                </div>
            </div>
        </div>
    </div>

    <!-- HALAMAN 4 -->
    <div id="page4" class="page">
        <h1 id="roomTitle" style="color: var(--netflix-red); font-weight: bold; margin-bottom: 20px;"></h1>
        <div id="roomBody" style="width: 100%; display: flex; justify-content: center; flex-direction: column; align-items: center;"></div>
        <button class="btn-start" onclick="nextPage(3)" style="font-size: 0.9rem; padding: 10px 20px; margin-top: 30px;">KEMBALI</button>
    </div>

    <script>
        let startScale = 1;

        // Reset otomatis ke halaman 1 saat refresh
        window.onload = function() {
            nextPage(1);
        };

        function moveFinish() {
            const btn = document.getElementById('finishBtn');
            const startBtn = document.getElementById('startBtn');
            const x = Math.random() * (window.innerWidth - 180);
            const y = Math.random() * (window.innerHeight - 60);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
            startScale += 0.15;
            startBtn.style.transform = `scale(${startScale})`;
        }

        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById('page' + pageNumber).style.display = 'flex';
        }

        function validateName() {
            const input = document.getElementById('nameInput').value.toLowerCase().trim();
            const allowed = "bhytania avrinda pubhyta vanha".toLowerCase();
            if (input === allowed) {
                nextPage(3);
            } else {
                document.getElementById('error-name').style.display = 'block';
            }
        }

        function openRoom(title) {
            const pin = prompt("🔐 Masukkan PIN 4-digit:");
            if (pin === "1111") {
                document.getElementById('roomTitle').innerText = title;
                let content = "";
                if (title === 'Pantai') {
                    content = `<div class="video-container"><iframe src="https://drive.google.com/file/d/1_rauyreFisKV5Z1V-HHJQ4pieAG4r792/preview" allow="autoplay"></iframe></div>`;
                } else if (title === 'CINTAKU') {
                    content = `<div style="text-align: center;"><h2>Room Spesial ✨</h2><p>Terima kasih sudah selalu ada.</p></div>`;
                } else {
                    content = `<div style="text-align: center;"><h3>Konten belum tersedia.</h3></div>`;
                }
                document.getElementById('roomBody').innerHTML = content;
                nextPage(4);
            } else {
                alert("❌ PIN Salah!");
            }
        }
    </script>
</body>
</html>
